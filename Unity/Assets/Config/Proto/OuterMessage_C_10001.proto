syntax = "proto3";
package ET;

message HttpGetRouterResponse
{
	repeated string Realms = 1;
	repeated string Routers = 2;
}

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType M2C_TestResponse
message C2M_TestRequest // ILocationRequest
{
	int32 RpcId = 1;
	string request = 2;
}

message M2C_TestResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string response = 4;
}

// ResponseType G2C_EnterMap
message C2G_EnterMap // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_EnterMap // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	/// 自己的UnitId
	int64 MyId = 4;
}

message MoveInfo
{
	repeated Unity.Mathematics.float3 Points = 1;
	Unity.Mathematics.quaternion Rotation = 2;
	int32 TurnSpeed = 3;
}

message UnitInfo
{
	int64 UnitId = 1;
	int32 ConfigId = 2;
	int32 Type = 3;
	Unity.Mathematics.float3 Position = 4;
	Unity.Mathematics.float3 Forward = 5;
	map<int32, int64> KV = 6;
	MoveInfo MoveInfo = 7;
}

message M2C_CreateUnits // IMessage
{
	repeated UnitInfo Units = 1;
}

message M2C_CreateMyUnit // IMessage
{
	UnitInfo Unit = 1;
}

message M2C_StartSceneChange // IMessage
{
	int64 SceneInstanceId = 1;
	string SceneName = 2;
}

message M2C_RemoveUnits // IMessage
{
	repeated int64 Units = 1;
}

message C2M_PathfindingResult // ILocationMessage
{
	int32 RpcId = 1;
	Unity.Mathematics.float3 Position = 2;
}

message C2M_Stop // ILocationMessage
{
	int32 RpcId = 1;
}

message M2C_PathfindingResult // IMessage
{
	int64 Id = 1;
	Unity.Mathematics.float3 Position = 2;
	repeated Unity.Mathematics.float3 Points = 3;
}

message M2C_Stop // IMessage
{
	int32 Error = 1;
	int64 Id = 2;
	Unity.Mathematics.float3 Position = 3;
	Unity.Mathematics.quaternion Rotation = 4;
}

// ResponseType G2C_Ping
message C2G_Ping // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Ping // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 Time = 4;
}


message G2C_Test // ISessionMessage
{
}

// ResponseType M2C_Reload
message C2M_Reload // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
}

message M2C_Reload // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType R2C_Login
message C2R_Login // ISessionRequest
{
	int32 RpcId = 1;
	string  Account = 2;  // 帐号
	string  Password = 3;  // 密码
}

message R2C_Login // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string Address = 4;
	int64 Key = 5;
	int64 GateId = 6;
	string AccountUUID = 7;  // 账号唯一标识符
}

// ResponseType R2C_Register
message C2R_Register // ISessionRequest
{
	int32 RpcId = 1;
	string  Account = 2;  // 帐号
	string  Password = 3;  // 密码
}

message R2C_Register // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_LoginGate
message C2G_LoginGate // ISessionRequest
{
	int32 RpcId = 1;
	int64 Key = 2;  // 帐号
	int64 GateId = 3;
}

message G2C_LoginGate // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 PlayerId = 4;
}

message G2C_TestHotfixMessage // ISessionMessage
{
	string Info = 1;
}

// ResponseType M2C_TestRobotCase
message C2M_TestRobotCase // ILocationRequest
{
	int32 RpcId = 1;
	int32 N = 2;
}

message M2C_TestRobotCase // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int32 N = 4;
}

message C2M_TestRobotCase2 // ILocationMessage
{
	int32 RpcId = 1;
	int32 N = 2;
}

message M2C_TestRobotCase2 // ILocationMessage
{
	int32 RpcId = 1;
	int32 N = 2;
}

// ResponseType M2C_TransferMap
message C2M_TransferMap // ILocationRequest
{
	int32 RpcId = 1;
}

message M2C_TransferMap // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_Benchmark
message C2G_Benchmark // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Benchmark // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// 服务器信息协议消息
message ServerInfoProto
{
	int32 ServerId = 1;
	string ServerName = 2;
	string ServerIP = 3;
	int32 ServerPort = 4;
	int32 Status = 5;  // ServerStatus枚举值
	int32 OnlineCount = 6;
	int32 MaxCount = 7;
	bool IsNew = 8;
	bool IsRecommend = 9;
	int64 OpenTime = 10;
	int32 ZoneId = 11;
}

// 服务器区组协议消息
message ServerZoneProto
{
	int32 ZoneId = 1;
	string ZoneName = 2;
	repeated ServerInfoProto ServerList = 3;
}

// ResponseType R2C_GetServerList
message C2R_GetServerList // ISessionRequest
{
	int32 RpcId = 1;
}

message R2C_GetServerList // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ServerZoneProto ZoneList = 4;
	int32 LastLoginServerId = 5;
}

// ResponseType R2C_SelectServer
message C2R_SelectServer // ISessionRequest
{
	int32 RpcId = 1;
	int32 ServerId = 2;
}

message R2C_SelectServer // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string ServerAddress = 4;
	int64 Key = 5;
	int64 GateId = 6;
	string AccountUUID = 7;  // 账号唯一标识符
	int64 PlayerID = 8;  // 玩家在指定服务器的唯一ID
}

// ResponseType G2C_GenerateEquipment
message C2G_GenerateEquipment // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_GenerateEquipment // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	EquipmentProto Equipment = 4;
	int32 SlotIndex = 5;
}

// ResponseType G2C_ReplaceEquipment  
message C2G_ReplaceEquipment // ISessionRequest
{
	int32 RpcId = 1;
	int64 EquipmentId = 2;  // 要穿戴的装备ID
	int32 SlotIndex = 3;    // 装备槽位索引
}

message G2C_ReplaceEquipment // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool Success = 4;       // 是否成功穿戴
}

// ResponseType G2C_CancelTempEquipment
message C2G_CancelTempEquipment // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_CancelTempEquipment // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool Success = 4;       // 是否成功取消
}

// ResponseType G2C_GetPlayerEquipments
message C2G_GetPlayerEquipments // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_GetPlayerEquipments // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated EquipmentProto Equipments = 4;  // 装备列表
	repeated int32 SlotIndexes = 5;          // 对应的槽位索引
}

// 装备协议消息
message EquipmentProto
{
	int64 Id = 1;           // 装备唯一ID
	string Name = 2;        // 装备名称
	int32 Level = 3;        // 装备等级
	int32 Attack = 4;       // 攻击力
	int32 Defense = 5;      // 防御力
	int32 Health = 6;       // 生命值
	int32 Quality = 7;      // 装备品质
	int32 EquipType = 8;    // 装备类型(武器、护甲等)
}