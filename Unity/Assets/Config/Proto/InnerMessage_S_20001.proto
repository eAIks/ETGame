syntax = "proto3";

package ET;

// ResponseType ObjectQueryResponse
message ObjectQueryRequest // IRequest
{
	int32 RpcId = 1;
	int64 Key = 2;
	int64 InstanceId = 3;
}

// ResponseType A2M_Reload
message M2A_Reload // IRequest
{
	int32 RpcId = 1;
}

message A2M_Reload // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2G_LockResponse
message G2G_LockRequest // IRequest
{
	int32 RpcId = 1;
	int64 Id = 2;
	string Address = 3;
}

message G2G_LockResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2G_LockReleaseResponse
message G2G_LockReleaseRequest // IRequest
{
	int32 RpcId = 1;
	int64 Id = 2;
	string Address = 3;
}

message G2G_LockReleaseResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType ObjectAddResponse
message ObjectAddRequest // IRequest
{
	int32 RpcId = 1;
	int32 Type = 2;
	int64 Key = 3;
	ActorId ActorId = 4;
}

message ObjectAddResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType ObjectLockResponse
message ObjectLockRequest // IRequest
{
	int32 RpcId = 1;
	int32 Type = 2;
	int64 Key = 3;
	ActorId ActorId = 4;
	int32 Time = 5;
}
message ObjectLockResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType ObjectUnLockResponse
message ObjectUnLockRequest // IRequest
{
	int32 RpcId = 1;
	int32 Type = 2;
	int64 Key = 3;
	ActorId OldActorId = 4;
	ActorId NewActorId = 5;
}
message ObjectUnLockResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType ObjectRemoveResponse
message ObjectRemoveRequest // IRequest
{
	int32 RpcId = 1;
	int32 Type = 2;
	int64 Key = 3;
}
message ObjectRemoveResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType ObjectGetResponse
message ObjectGetRequest // IRequest
{
	int32 RpcId = 1;
	int32 Type = 2;
	int64 Key = 3;
}
message ObjectGetResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int32 Type = 4;
	ActorId ActorId = 5;
}

// ResponseType G2R_GetLoginKey
message R2G_GetLoginKey // IRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string AccountUUID = 3;  // 账号唯一标识符
	int64 PlayerID = 4;  // 玩家在指定服务器的唯一ID
	int32 ServerId = 5;  // 配表中的服务器ID
}

message G2R_GetLoginKey // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 Key = 4;
	int64 GateId = 5;
	int64 PlayerID = 6;  // 玩家在指定服务器的唯一ID
}

message G2M_SessionDisconnect // ILocationMessage
{
	int32 RpcId = 1;
}

// ResponseType M2G_PlayerEnterMapResponse
message G2M_PlayerEnterMapRequest // IRequest
{
	int32 RpcId = 1;
	string Account = 2;
	int32 ServerId = 3;
}

message M2G_PlayerEnterMapResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 PlayerId = 4;  // 创建的PlayerId
}

message ObjectQueryResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bytes Entity = 4;
}

// ResponseType M2M_UnitTransferResponse
message M2M_UnitTransferRequest // IRequest
{
	int32 RpcId = 1;
	ActorId OldActorId = 2;
	bytes Unit = 3;
	repeated bytes Entitys = 4;
}

message M2M_UnitTransferResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType M2G_GenerateEquipment
message G2M_GenerateEquipment // IRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
}

message M2G_GenerateEquipment // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	EquipmentProto Equipment = 4;
	int32 SlotIndex = 5;
}

// ResponseType M2G_ReplaceEquipment
message G2M_ReplaceEquipment // IRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
	int64 EquipmentId = 3;
	int32 SlotIndex = 4;
}

message M2G_ReplaceEquipment // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool Success = 4;
}

// ResponseType M2G_CancelTempEquipment
message G2M_CancelTempEquipment // IRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
}

message M2G_CancelTempEquipment // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool Success = 4;
}

// ResponseType M2G_GetPlayerEquipments
message G2M_GetPlayerEquipments // IRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
}

message M2G_GetPlayerEquipments // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated EquipmentProto Equipments = 4;  // 装备列表
	repeated int32 SlotIndexes = 5;          // 对应的槽位索引
}

